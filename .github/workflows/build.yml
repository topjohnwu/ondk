name: ondk build

on:
  workflow_dispatch:

jobs:
  linux:
    name: Build for Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Clean up storage
        run: |
          sudo rm -rf \
            "$JAVA_HOME_8_X64" "$JAVA_HOME_11_X64" "$JAVA_HOME_17_X64" "$JAVA_HOME_21_X64" \
            "$CHROMEWEBDRIVER" "$EDGEWEBDRIVER" "$GECKOWEBDRIVER" \
            /usr/local/lib/android

      - name: Build toolchain
        run: |
          sudo apt-get update
          sudo apt-get -y install cmake ninja-build binutils-dev
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get -y install libc++-22-dev libc++abi-22-dev
          rm llvm.sh
          ./build.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.xz
          archive: false

  windows:
    name: Build for Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            msystem: CLANG64
          - arch: aarch64
            runner: windows-11-arm
            msystem: CLANGARM64
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: tar patch unzip
          pacboy: cmake:p ninja:p clang:p lld:p libc++:p python:p

      - name: Build toolchain
        run: ./build.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.xz
          archive: false

  macos:
    name: Build for macOS (${{ matrix.arch }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build toolchain
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          brew reinstall ninja binutils gpatch
          ./build.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.xz
          archive: false
