change-id = 148671

[llvm]
download-ci-llvm = false
link-shared = true

[build]
docs = false
submodules = false
extended = true
tools = [
    "cargo",
    "src",
    "clippy",
    "rustfmt",
    "rust-analyzer",
    "rust-analyzer-proc-macro-srv",
]
cargo-native-static = true

[install]
prefix = "../../out/rust"
sysconfdir = "etc"

[rust]
channel = "nightly"
lto = "thin"
strip = false
lld = false
codegen-units = 1

[target.aarch64-unknown-linux-gnu]
llvm-config = "../../out/llvm/bin/llvm-config"

[target.x86_64-unknown-linux-gnu]
llvm-config = "../../out/llvm/bin/llvm-config"

[target.aarch64-apple-darwin]
llvm-config = "../../out/llvm/bin/llvm-config"
jemalloc = true
cc = "aarch64-apple-darwin-clang"
cxx = "aarch64-apple-darwin-clang++"
linker = "aarch64-apple-darwin-clang"

[target.x86_64-apple-darwin]
llvm-config = "../../out/llvm/bin/llvm-config"
jemalloc = true
cc = "x86_64-apple-darwin-clang"
cxx = "x86_64-apple-darwin-clang++"
linker = "x86_64-apple-darwin-clang"

[target.x86_64-pc-windows-gnullvm]
llvm-config = "../../out/llvm/bin/llvm-config.exe"
cc = "clang"
cxx = "clang++"
linker = "clang"

[target.aarch64-pc-windows-gnullvm]
llvm-config = "../../out/llvm/bin/llvm-config.exe"
cc = "clang"
cxx = "clang++"
linker = "clang"
