change-id = 148671

[llvm]
download-ci-llvm = false
link-shared = true

[build]
docs = false
submodules = false
extended = true
tools = [
    "cargo",
    "src",
    "clippy",
    "rustfmt",
    "rust-analyzer",
    "rust-analyzer-proc-macro-srv",
]
cargo-native-static = true

[install]
sysconfdir = "etc"

[rust]
channel = "nightly"
lto = "thin"
strip = false
lld = true
codegen-units = 1
debuginfo-level-std = 1
remap-debuginfo = true
